[bar.default]
start = [ "launcher", "workspaces" ]
center = [ "clock", "weather" ]
end = [
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "input_volume",
    "volume",
    "brightness",
    "battery",
    "cpu"
]
margin_ends = 0
padding = 12
radius = 0
scale = 0.95
shadow = false
thickness = 25
widget_spacing = 12
capsule_radius = 0
capsule_thickness = 1.0

[location]
auto_locate = true

[osd]
enabled = false

[shell]
app_icon_color = "secondary"
app_icon_colorize = true
avatar_path = "/home/marko/pictures/kiki.png"
corner_radius_scale = 0.0
font_family = "JetBrains Mono"

[shell.animation]
enabled = false

[shell.launcher]
categories = false
compact = true

[shell.panel]
clipboard_placement = "attached"
open_near_click_clipboard = true
open_near_click_control_center = true

[theme]
custom_palette = "custom"
mode = "dark"
pure_black_dark = true
source = "custom"

[wallpaper]
enabled = true

[widget.workspaces]
active_pill_size = 1.10
capsule_padding = 0
capsule_radius = 0
empty_color = "on_primary"
occupied_color = "tertiary"
font_weight = 600
inactive_pill_size = 1.10
scale = 1.2
